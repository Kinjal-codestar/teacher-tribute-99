<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" class="fountain-pen-svg" width="120" height="120">
  <defs>
    <!-- 1. Antique Gold Palette (Multi-stop for realistic metallic luster) -->
    <linearGradient id="vintageGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7025" />
      <stop offset="25%" stop-color="#C89B3C" />
      <stop offset="50%" stop-color="#F2DF9B" />
      <stop offset="70%" stop-color="#E8C76A" />
      <stop offset="90%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#7B5618" />
    </linearGradient>

    <!-- 2. Rhodium / Champagne Silver Inlay (Two-tone nib interior) -->
    <linearGradient id="rhodiumInlay" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8B5AE" />
      <stop offset="35%" stop-color="#EFECE6" />
      <stop offset="65%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C5C2BA" />
    </linearGradient>

    <!-- 3. Deep Black Lacquer Resin (70% Charcoal / Obsidian Body) -->
    <linearGradient id="blackResin" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141211" />
      <stop offset="30%" stop-color="#2A2422" />
      <stop offset="55%" stop-color="#3A3330" />
      <stop offset="80%" stop-color="#1F1B1A" />
      <stop offset="100%" stop-color="#0E0C0C" />
    </linearGradient>

    <!-- 4. Cylindrical Specular Glare (Warm lighting reflection) -->
    <linearGradient id="cylinderHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 5. Soft Tactile Drop Shadow -->
    <filter id="penRealisticShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="3" flood-color="#1A1412" flood-opacity="0.22" />
    </filter>
  </defs>

  <g id="fountain-pen-master" filter="url(#penRealisticShadow)">
    <!-- ==========================================
         I. BARREL (Long Classic Obsidian Body)
         ========================================== -->
    <g id="barrel">
      <!-- Main Cylindrical Body (extending towards upper-right) -->
      <path id="main-body" d="M52 50 L98 4 C103 -1 111 1 115 5 L116 6 C120 10 120 17 115 22 L69 68 Z" fill="url(#blackResin)" />
      
      <!-- Cylindrical Soft Reflection Highlight -->
      <path id="body-highlight" d="M54 48 L99 3 C103 0 107 1 109 3 L65 63 Z" fill="url(#cylinderHighlight)" />
      
      <!-- Rounded End-Cap Dome -->
      <path id="end-cap" d="M112 3 C117 7 119 13 115 18 L114 17 C117 13 116 8 111 4 Z" fill="url(#vintageGold)" opacity="0.9" />

      <!-- Dual Antique Gold Cap Bands / Rings -->
      <polygon id="gold-ring-primary" points="49,47 53,51 70,68 66,72" fill="url(#vintageGold)" />
      <polygon id="gold-ring-accent" points="45,43 48,46 65,63 62,66" fill="url(#vintageGold)" />
    </g>

    <!-- ==========================================
         II. GRIP SECTION (Ergonomic Tapered Neck)
         ========================================== -->
    <g id="grip">
      <!-- Ergonomic Dark Resin Grip -->
      <polygon id="grip-body" points="30,59 47,42 63,58 46,75" fill="#1A1716" />
      <!-- Grip Subtle Sheen -->
      <polygon id="grip-highlight" points="31,58 46,43 50,47 35,62" fill="url(#cylinderHighlight)" opacity="0.4" />
      
      <!-- Gold Collar Ring at Nib Base -->
      <polygon id="nib-collar-ring" points="27,62 31,58 47,74 43,78" fill="url(#vintageGold)" />
    </g>

    <!-- ==========================================
         III. NIB (Iconic Two-Tone Calligraphy Nib)
         Nib tip aligns precisely at coordinate (3.6, 116.4)
         ========================================== -->
    <g id="nib">
      <!-- 1. Outer Antique Gold Nib Base (Classic contoured silhouette) -->
      <path id="nib-base" d="M3.6 116.4 C7.5 107 17 88 29 60 L45 76 C26 89 12 105 3.6 116.4 Z" fill="url(#vintageGold)" stroke="#7B5618" stroke-width="0.3" />

      <!-- 2. Rhodium / Champagne Silver Inner Inlay (Luxury Two-Tone Detail) -->
      <path id="rhodium-inlay" d="M9.5 106 C14 96 22 81 30 65 L40 75 C25 85 16 97 9.5 106 Z" fill="url(#rhodiumInlay)" stroke="#A09D96" stroke-width="0.25" />

      <!-- 3. Central Ink Slit (Fine dark capillary channel) -->
      <line id="ink-slit" x1="3.6" y1="116.4" x2="24.5" y2="84.5" stroke="#1A120A" stroke-width="0.9" stroke-linecap="round" />

      <!-- 4. Visible Breather Hole (Classic circular heart hole) -->
      <circle id="breather-hole" cx="25" cy="84" r="2.0" fill="#14110F" stroke="#9A7025" stroke-width="0.5" />

      <!-- 5. Filigree Scroll Engravings (Left & Right Wings, ~0.4 opacity) -->
      <!-- Left Wing Engraving -->
      <path id="engraving-left-1" d="M14.5 102 C17 97 21 93 25.5 91" stroke="#9A7025" stroke-width="0.65" stroke-linecap="round" fill="none" opacity="0.45" />
      <path id="engraving-left-2" d="M19 104 C21.5 100 26 97.5 30 96" stroke="#9A7025" stroke-width="0.55" stroke-linecap="round" fill="none" opacity="0.4" />
      <!-- Right Wing Engraving -->
      <path id="engraving-right-1" d="M28 72 L35 79" stroke="#9A7025" stroke-width="0.6" stroke-linecap="round" opacity="0.45" />
      <path id="engraving-right-2" d="M33 76 L38 81" stroke="#9A7025" stroke-width="0.5" stroke-linecap="round" opacity="0.38" />

      <!-- 6. Iridium Nib Writing Tip (Contact point highlight) -->
      <circle id="nib-tip" cx="4" cy="116" r="1.1" fill="#FFFFFF" opacity="0.95" />
      <circle cx="4" cy="116" r="0.5" fill="#E8C76A" />
    </g>
  </g>
</svg>
